<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
    }
    header {
      background: #2563eb;
      color: #fff;
      padding: 20px;
    }
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #dcfce7;
      color: #166534;
    }
    nav a {
      color: #dbeafe;
      margin-right: 12px;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>TaskBoard</h1>
    <p>Navchalnyi naskriznyi proiekt dlia keruvannia zavdanniamy.</p>
    <nav>
      <a href="./index.html">Holovna</a>
      <a href="./about.html">Pro proiekt</a>
    </nav>
  </header>
  <main>
    <section class="card">
      <h2>Potuchni zavdannia</h2>
      <p>Demonstratsiina storinka dlia laboratornoi roboty #5.</p>
      <p><span class="status">In progress</span></p>
    </section>
    <section class="card">
      <h2>Nastupnyi krok</h2>
      <ul>
        <li>Dodaty adaptyvnu verstku.</li>
        <li>Pidkliuchyty JavaScript.</li>
        <li>Pidgotuvaty backend na Flask.</li>
      </ul>
    </section>
  </main>
</body>
</html>
